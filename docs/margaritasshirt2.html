<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
 html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
}

#view3d {
  width: 90vw;
  height: 90vh;
  margin: auto;
  position: relative;
  background: #f5f5f5;
  overflow: hidden;
  box-sizing: border-box;
  padding: 20px;
}

/* Canvas de View3D ocupa todo el contenedor */
#view3d .view3d-canvas {
  width: 100% !important;
  height: 100% !important;
  display: block;
}
  </style>
</head>
<body>
  <!-- Cambia "scene.gltf" o "scene.glb" por tu modelo
  <model-viewer
        id="reveal" 
        loading="eager" 
        poster="https://menutechdeveloper.github.io/modelados3d/shirt/margaritas2d.png"
        src="https://menutechdeveloper.github.io/modelados3d/shirt/margaritas.gltf"  
        shadow-intensity="5" 
        camera-controls
        ar-scale="fixed"
        alt="element3D"
           exposure="1"
    environment-image="neutral"
  
    >
    </model-viewer>-->
    <div id="view3d">
    <canvas class="view3d-canvas"></canvas>
    <div class="v3d-loader">
      <div class="v3d-loader-progress"></div>
    </div>
  </div>
  <script src="https://unpkg.com/@egjs/view3d@latest/dist/view3d.pkgd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@egjs/view3d@latest/css/view3d-bundle.min.css">


<script>
const view3D = new View3D("#view3d", { 
  src: "https://menutechdeveloper.github.io/modelados3d/shirt/margaritas.gltf",
   poster: "https://menutechdeveloper.github.io/modelados3d/shirt/margaritas2d.png",
  autoInit: true,
});

// Loader
view3D.on("loadStart", () => {
  document.querySelector(".v3d-loader-progress").style.width = "0%";
});
view3D.on("progress", e => {
  document.querySelector(".v3d-loader-progress").style.width = (e.loaded * 100) + "%";
});
view3D.on("load", () => {
  document.querySelector(".v3d-loader").style.display = "none";
});
view3D.on("ready", () => {
  // Escala global del modelo
  view3D.scene.scale.set(3, 3, 3);

  // Ocultar barra de carga y poster
  document.querySelector(".v3d-loader").style.display = "none";
  const poster = document.querySelector(".view3d-poster");
  if (poster) poster.style.display = "none";
});

</script>
<script>
(function fixView3DPoster(wrapperSelector = "#view3d", padding = 20) {
  const wrapper = document.querySelector(wrapperSelector);
  if (!wrapper) return;

  const applyStyles = (el) => {
    if (!el) return;
    // Center and keep full image visible
    el.style.position = "absolute";
    el.style.top = "50%";
    el.style.left = "50%";
    el.style.transform = "translate(-50%, -50%)";
    el.style.boxSizing = "border-box";

    // FORZAR que no tenga filtro (usa !important para sobreescribir inline/styles de la librería)
    el.style.setProperty("filter", "none", "important");

    // If it's an <img> (string poster) — use object-fit
    if (el.tagName && el.tagName.toLowerCase() === "img") {
      el.style.width = "auto";
      el.style.height = `calc(100% - ${padding * 2}px)`;
      el.style.maxWidth = `calc(100% - ${padding * 2}px)`;
      el.style.maxHeight = `calc(100% - ${padding * 2}px)`;
      el.style.objectFit = "contain";
      el.style.margin = "0";
    } else {
      // If it's a div with background-image
      el.style.width = `calc(100% - ${padding * 2}px)`;
      el.style.height = `calc(100% - ${padding * 2}px)`;
      el.style.maxWidth = `calc(100% - ${padding * 2}px)`;
      el.style.maxHeight = `calc(100% - ${padding * 2}px)`;
      el.style.backgroundSize = "contain";
      el.style.backgroundRepeat = "no-repeat";
      el.style.backgroundPosition = "center center";
    }
  };

  // Try immediate (if already inserted)
  const existing = wrapper.querySelector(".view3d-poster");
  if (existing) applyStyles(existing);

  // Observe for insertion (very reliable)
  const mo = new MutationObserver(() => {
    const p = wrapper.querySelector(".view3d-poster");
    if (p) {
      applyStyles(p);
      mo.disconnect();
    }
  });
  mo.observe(wrapper, { childList: true, subtree: true });

  // Safety: re-apply on resize (keeps proportions)
  window.addEventListener("resize", () => {
    const p = wrapper.querySelector(".view3d-poster");
    if (p) applyStyles(p);
  });
})();
</script>
</body>
</html>
